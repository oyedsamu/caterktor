android.useAndroidX=true
caterktor.version=0.5.0

# Dokka V2 — enables dokkaGenerate aggregation without V1 migration-helper noise.
# V2 is stable in Dokka 2.0.0; migration guide: https://kotl.in/dokka-gradle-migration
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.incremental=true

# OkHttp 5.x (via Ktor 3.5.0+) requires compileSdk 37, which is above what AGP 8.13.2
# officially supports. AGP 9.4 is the first release to support API 37 and needs Gradle 9.6.
# Suppress the warning until that upgrade lands.
android.suppressUnsupportedCompileSdk=37
